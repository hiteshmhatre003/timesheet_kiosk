{% raw %}<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1a1d23" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Timesheet" />
<title>Timesheet Kiosk</title>{% endraw %}
<script>window.FRAPPE_CSRF_TOKEN = "{{ csrf_token }}";</script>
{% raw %}
<!--
  Plain HTML/CSS/JS frontend — no build step. Nothing to paste here after
  a `pnpm build`; these files are committed as-is under public/ and served
  by Frappe at /assets/timesheet_kiosk/... automatically.

  The "?v=..." on each asset URL below is a cache-buster (see
  timesheet-kiosk.py's get_context docstring) — it changes on every page
  load specifically so a browser can never keep serving an old cached
  JS/CSS file after a new version has been deployed.
-->
{% endraw %}
<link rel="manifest" href="/assets/timesheet_kiosk/timesheet-kiosk-manifest.json?v={{ asset_version }}" />
<link rel="apple-touch-icon" href="/assets/timesheet_kiosk/images/icon-192.png?v={{ asset_version }}" />
<link rel="icon" href="/assets/timesheet_kiosk/images/icon-192.png?v={{ asset_version }}" />
{% raw %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
{% endraw %}
<link rel="stylesheet" href="/assets/timesheet_kiosk/css/timesheet-kiosk.css?v={{ asset_version }}" />
</head>
<body>
{% raw %}<div id="root"></div>{% endraw %}
<script src="/assets/timesheet_kiosk/js/timesheet-kiosk-api.js?v={{ asset_version }}"></script>
<script src="/assets/timesheet_kiosk/js/timesheet-kiosk-app.js?v={{ asset_version }}"></script>
{% raw %}</body>
</html>{% endraw %}
